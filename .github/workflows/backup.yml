name: Backup
# Nightly during a trip (the server says when: /api/backup/due, from the day before a book starts to two days after it ends —
# kept 30 days) and weekly always (kept 90 days): an off-site copy of the whole memory book (data + full photos, incl. sealed letters) as an Actions artifact.
# Opt-in: needs repo secrets MB_URL (https://<domain>), MB_BACKUP_TOKEN (same value as Railway's BACKUP_TOKEN) and
# MB_BACKUP_PASSPHRASE (a long random passphrase kept outside GitHub too — without it the backup cannot be opened).
# The zip is encrypted (gpg, AES-256) before it leaves the runner: artifacts of a PUBLIC repo are downloadable by any
# signed-in GitHub user, so only ciphertext is ever uploaded. Restore: gpg -d memory-book-backup.zip.gpg > backup.zip
on:
  schedule:
    - cron: '17 19 * * 0'   # weekly: Sunday 19:17 UTC = Monday 02:17 Bangkok
    - cron: '23 16 * * *'   # nightly, only while a trip is on: 16:23 UTC = 23:23 Bangkok, 00:23 Hong Kong, 03:23 Sydney (summer)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Is a trip on? (nightly run only)
        id: due
        env:
          MB_URL: ${{ secrets.MB_URL }}
          MB_BACKUP_TOKEN: ${{ secrets.MB_BACKUP_TOKEN }}
          NIGHTLY: ${{ github.event_name == 'schedule' && github.event.schedule == '23 16 * * *' }}
        run: |
          if [ "$NIGHTLY" != "true" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; echo "keep=90" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$MB_URL" ] || [ -z "$MB_BACKUP_TOKEN" ]; then echo "::error::secrets MB_URL / MB_BACKUP_TOKEN are not set"; exit 1; fi
          MB_BACKUP_TOKEN=$(printf '%s' "$MB_BACKUP_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          due=$(curl -fsS --retry 3 -H "Authorization: Bearer $MB_BACKUP_TOKEN" "${MB_URL%/}/api/backup/due" | python3 -c "import json,sys; print('yes' if json.load(sys.stdin)['due'] else 'no')")
          echo "a trip is on: $due"
          echo "run=$due" >> "$GITHUB_OUTPUT"; echo "keep=30" >> "$GITHUB_OUTPUT"
      - name: Download, check and encrypt backup.zip
        if: steps.due.outputs.run == 'yes'
        env:
          MB_URL: ${{ secrets.MB_URL }}
          MB_BACKUP_TOKEN: ${{ secrets.MB_BACKUP_TOKEN }}
          MB_BACKUP_PASSPHRASE: ${{ secrets.MB_BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$MB_URL" ] || [ -z "$MB_BACKUP_TOKEN" ] || [ -z "$MB_BACKUP_PASSPHRASE" ]; then
            echo "::error::secrets MB_URL / MB_BACKUP_TOKEN / MB_BACKUP_PASSPHRASE are not all set — nothing was backed up"; exit 1
          fi
          umask 077
          MB_BACKUP_TOKEN=$(printf '%s' "$MB_BACKUP_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')   # a pasted trailing newline/space is not part of the token
          echo "token: ${#MB_BACKUP_TOKEN} characters (the server needs 24+ and the same value in Railway's BACKUP_TOKEN)"
          curl -fsS --retry 3 -H "Authorization: Bearer $MB_BACKUP_TOKEN" -o memory-book-backup.zip "${MB_URL%/}/api/backup.zip"
          unzip -tq memory-book-backup.zip
          unzip -p memory-book-backup.zip backup.json | python3 -c "import json,sys; b=json.load(sys.stdin); assert b['complete']; print({k: len(v) for k, v in b['tables'].items()})"
          echo "photos: $(unzip -l memory-book-backup.zip | grep -c 'photos/')  size: $(du -h memory-book-backup.zip | cut -f1)"
          printf '%s' "$MB_BACKUP_PASSPHRASE" | gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --compress-algo none -o memory-book-backup.zip.gpg memory-book-backup.zip
          shred -u memory-book-backup.zip
          # prove the passphrase opens it before uploading
          printf '%s' "$MB_BACKUP_PASSPHRASE" | gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 -d -o check.zip memory-book-backup.zip.gpg
          unzip -tq check.zip && shred -u check.zip
          echo "encrypted: $(du -h memory-book-backup.zip.gpg | cut -f1)"
      - uses: actions/upload-artifact@v5
        if: steps.due.outputs.run == 'yes'
        with:
          name: memory-book-backup-${{ github.run_number }}
          path: memory-book-backup.zip.gpg
          retention-days: ${{ steps.due.outputs.keep }}
          if-no-files-found: error
          compression-level: 0
