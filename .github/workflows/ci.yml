name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  migrations-journaled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Every migration is in journal.json, numbered 0001.. without gaps
        run: node scripts/check-migrations.js

  # the suite runs in three parts side by side (it took 18–21 min in one job, Nov 2026); "test" below waits for all three, so the
  # check that branch protection and the merge flow read keeps its name
  test-part:
    runs-on: ubuntu-latest
    # setup can be slow when Ubuntu's package mirror is (Nov 2026: 18–24 min of apt downloads left the tests a minute and the part was
    # cancelled); the packages are cached below and the tests have their own limit, so a slow mirror no longer eats the test time
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: ui, only: 'ui' }
          - { name: story-offline, only: 'story,offline' }
          - { name: rest, only: 'infra,bookshelf,family,import,weather,auth,devices,passkey,visual,viewers' }
    name: test (${{ matrix.part.name }})
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # the Debian packages (Chromium's libraries, poppler, ffmpeg) and the browser are kept between runs: apt then reads them from
      # disk instead of the mirror; a new runner image or a new Playwright makes a fresh cache
      - name: Restore the downloaded packages and the browser
        uses: actions/cache@v4
        with:
          path: |
            ~/apt-debs
            ~/.cache/ms-playwright
          key: setup-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-ffmpeg-poppler-v1
      - name: Put the cached packages where apt looks
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/81-keep >/dev/null
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          if ls ~/apt-debs/*.deb >/dev/null 2>&1; then sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/; fi
      - run: npx playwright install --with-deps chromium
      - name: pdftotext for the PDF-import test and ffmpeg for video clips (as in the production image)
        run: sudo apt-get install -y --no-install-recommends poppler-utils ffmpeg
      - name: Keep the packages for the next run
        run: mkdir -p ~/apt-debs && cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
      - name: S3 emulator for the bucket adapter
        run: |
          mkdir -p "$RUNNER_TEMP/s3"
          npx s3rver -d "$RUNNER_TEMP/s3" -p 4569 --configure-bucket mb-test --silent &
          for i in $(seq 1 20); do curl -s -o /dev/null localhost:4569 && break; sleep 0.5; done
      - name: End-to-end + infra tests (${{ matrix.part.name }})
        timeout-minutes: 20
        run: npm test
        env:
          TEST_ONLY: ${{ matrix.part.only }}
          SHOTS: ${{ runner.temp }}/mb-shots
          TEST_DATABASE_URL: postgres://postgres:pg@localhost:5432/postgres
          TEST_S3_ENDPOINT: http://localhost:4569
          TEST_S3_KEY: S3RVER
          TEST_S3_SECRET: S3RVER
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mb-shots-${{ matrix.part.name }}
          path: ${{ runner.temp }}/mb-shots
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    needs: test-part
    if: always()
    timeout-minutes: 2
    steps:
      - name: Every part passed
        run: test "${{ needs.test-part.result }}" = "success"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image (same Dockerfile Railway uses)
        run: docker build -t memory-book .
      - name: Boot it next to Postgres and hit /healthz
        run: |
          docker network create mbnet
          docker run -d --name db --network mbnet -e POSTGRES_PASSWORD=pg postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 1; done
          docker run -d --name mb --network mbnet -p 3000:3000 -e FAMILY_CODE=ci-passphrase \
            -e DATABASE_URL=postgres://postgres:pg@db:5432/postgres -v "$RUNNER_TEMP/mbdata:/data" memory-book
          for i in $(seq 1 30); do curl -fsS localhost:3000/healthz && break; sleep 1; done
          curl -fsS localhost:3000/healthz || { docker logs mb; exit 1; }
      - name: Runs as non-root, migrations applied, trips seeded, app shell served
        run: |
          uid=$(docker exec mb sh -c 'grep "^Uid:" /proc/1/status | cut -f2')
          echo "server uid: $uid"; test "$uid" != "0"
          docker logs mb | grep -q "migration 0001_init.sql applied"
          docker logs mb | grep -q "2 seeded trips"
          docker exec mb test -w /data
          curl -fsS localhost:3000/ | grep -q "LifeBook"
          curl -fsS -o /dev/null localhost:3000/fonts/KIRA-UI-Regular.woff2
          # archiver 8 is ESM-only and server/backup.js require()s it: the image's Node must load it and build a zip
          docker exec mb node -e "const {ZipArchive}=require('archiver');const z=new ZipArchive();let n=0;z.on('data',(d)=>{n+=d.length});z.on('end',()=>{console.log(process.version,'zip',n);if(!n)process.exit(1)});z.append('x',{name:'a.txt'});z.finalize()"
      - name: Server-side PDF works inside the production image (Chromium installed, runs as non-root)
        run: |
          ck=$(curl -s -D - -o /dev/null -H 'x-mb: 1' -H 'content-type: application/json' \
            -d '{"code":"ci-passphrase","name":"ci"}' localhost:3000/api/login | grep -i '^set-cookie' | sed 's/^[^:]*: //;s/;.*//')
          curl -fsS --max-time 120 -H "cookie: $ck" -o book.pdf localhost:3000/api/b/pdf/hk-macau-2026 || { docker logs mb; exit 1; }
          head -c 5 book.pdf | grep -q '%PDF-'
          echo "PDF $(wc -c < book.pdf) bytes"
      - name: Graceful shutdown on SIGTERM (Railway redeploys)
        run: |
          docker stop -t 15 mb
          test "$(docker inspect -f '{{.State.ExitCode}}' mb)" = "0" || { docker logs mb; exit 1; }
      - name: Refuses to boot in production without DATABASE_URL
        run: |
          if docker run --rm -e FAMILY_CODE=x memory-book; then echo "booted without DATABASE_URL"; exit 1; fi
