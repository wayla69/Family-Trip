name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  migrations-journaled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Every migration is in journal.json, numbered 0001.. without gaps
        run: node scripts/check-migrations.js

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: S3 emulator for the bucket adapter
        run: |
          mkdir -p "$RUNNER_TEMP/s3"
          npx s3rver -d "$RUNNER_TEMP/s3" -p 4569 --configure-bucket mb-test --silent &
          for i in $(seq 1 20); do curl -s -o /dev/null localhost:4569 && break; sleep 0.5; done
      - name: End-to-end + infra tests
        run: npm test
        env:
          SHOTS: ${{ runner.temp }}/mb-shots
          TEST_DATABASE_URL: postgres://postgres:pg@localhost:5432/postgres
          TEST_S3_ENDPOINT: http://localhost:4569
          TEST_S3_KEY: S3RVER
          TEST_S3_SECRET: S3RVER
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mb-shots
          path: ${{ runner.temp }}/mb-shots
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image (same Dockerfile Railway uses)
        run: docker build -t memory-book .
      - name: Boot it next to Postgres and hit /healthz
        run: |
          docker network create mbnet
          docker run -d --name db --network mbnet -e POSTGRES_PASSWORD=pg postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 1; done
          docker run -d --name mb --network mbnet -p 3000:3000 -e FAMILY_CODE=ci-passphrase \
            -e DATABASE_URL=postgres://postgres:pg@db:5432/postgres -v "$RUNNER_TEMP/mbdata:/data" memory-book
          for i in $(seq 1 30); do curl -fsS localhost:3000/healthz && break; sleep 1; done
          curl -fsS localhost:3000/healthz || { docker logs mb; exit 1; }
      - name: Runs as non-root, volume writable, migrations applied
        run: |
          uid=$(docker exec mb sh -c 'grep "^Uid:" /proc/1/status | cut -f2')
          echo "server uid: $uid"; test "$uid" != "0"
          docker exec mb test -s /data/memory.db
          docker logs mb | grep -q "data in /data"
          docker logs mb | grep -q "migration 0001_init.sql applied"
      - name: Refuses to boot in production without DATABASE_URL
        run: |
          if docker run --rm -e FAMILY_CODE=x memory-book; then echo "booted without DATABASE_URL"; exit 1; fi
