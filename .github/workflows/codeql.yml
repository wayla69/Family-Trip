# Looks through the code for the usual holes (injection, unsafe paths, cross-site scripting) on every PR and once a week;
# findings show under the repository's Security tab.
name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 19 * * 0'
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript
