# Looks through the code for the usual holes (injection, unsafe paths, cross-site scripting) on every PR and once a week;
# findings show under the repository's Security tab.
name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 19 * * 0'
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript
          output: sarif-results
      # The findings in the log too (rule · file:line · the rule's short text — code locations only, no data): the Security tab is not
      # readable from every tool that works on this repo.
      - name: List the findings
        if: always()
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const dir = "sarif-results"; let n = 0, out = [];
            for (const f of fs.existsSync(dir) ? fs.readdirSync(dir) : []) {
              const s = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
              for (const run of s.runs || []) for (const r of run.results || []) {
                const loc = ((r.locations || [])[0] || {}).physicalLocation || {};
                out.push(`${r.ruleId} · ${(loc.artifactLocation || {}).uri}:${(loc.region || {}).startLine} · ${String((r.message || {}).text || "").split("\n")[0].slice(0, 160)}`); n++;
              }
            }
            console.log(out.sort().join("\n")); console.log(`${n} findings`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "```\n" + out.sort().join("\n") + "\n" + n + " findings\n```\n");
          '
