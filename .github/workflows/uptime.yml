name: Uptime
# Every 15 minutes: is the live site up (Postgres + photo storage via /healthz), is the app shell served, does the login wall hold?
# A failure opens one GitHub issue "🔴 Site down" (GitHub notifies the owner by e-mail/app); recovery comments and closes it.
# Needs the repo secret MB_URL (https://<domain>) — kept secret on purpose: the repo is public and the domain stays out of it.
# Nothing is added to the app itself (no third-party scripts, nothing sent anywhere but GitHub).
# Note: GitHub pauses scheduled workflows in a public repo after 60 days without commits — re-enable it under Actions if that happens.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the live site
        id: probe
        env:
          MB_URL: ${{ secrets.MB_URL }}
        run: |
          if [ -z "$MB_URL" ]; then echo "::notice::MB_URL is not set — uptime check skipped"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          B="${MB_URL%/}"; bad=""
          # 3 tries 40 s apart per check, so a Railway redeploy (about a minute) does not raise an alarm
          probe() { want=$1; url=$2; for n in 1 2 3; do code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true); [ "$code" = "$want" ] && break; [ $n -lt 3 ] && sleep 40; done; echo "${code:-000}"; }
          h=$(probe 200 "$B/healthz");               [ "$h" = 200 ] || bad="$bad health=$h"
          s=$(probe 200 "$B/sw.js");                 [ "$s" = 200 ] || bad="$bad app=$s"
          a=$(probe 401 "$B/api/b/state");           [ "$a" = 401 ] || bad="$bad login-wall=$a"
          echo "healthz=$h app=$s login-wall=$a"
          if [ -n "$bad" ]; then echo "down=1" >> "$GITHUB_OUTPUT"; echo "why=$bad" >> "$GITHUB_OUTPUT"; else echo "down=0" >> "$GITHUB_OUTPUT"; fi

      - name: Open or close the alert issue
        if: steps.probe.outputs.skip != '1'
        uses: actions/github-script@v7
        env:
          DOWN: ${{ steps.probe.outputs.down }}
          WHY: ${{ steps.probe.outputs.why }}
        with:
          script: |
            const title = '🔴 Site down — Memory Bookshelf';
            const open = (await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'uptime', per_page: 5 })).data.find((i) => i.title === title);
            const when = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (process.env.DOWN === '1') {
              const body = `${when}: the check failed (${process.env.WHY.trim()}) after 3 tries.\n\nเว็บไม่ตอบหรือมีปัญหา — ดู Railway → Deployments / Logs\n\n${run}`;
              if (open) await github.rest.issues.createComment({ ...context.repo, issue_number: open.number, body });
              else await github.rest.issues.create({ ...context.repo, title, labels: ['uptime'], body });
              core.setFailed(`site down: ${process.env.WHY}`);
            } else if (open) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.number, body: `${when}: back up ✅ — เว็บกลับมาใช้ได้แล้ว\n\n${run}` });
              await github.rest.issues.update({ ...context.repo, issue_number: open.number, state: 'closed', state_reason: 'completed' });
            }
