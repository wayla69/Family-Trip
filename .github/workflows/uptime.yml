name: Uptime
# Every 15 minutes: is the live site up (Postgres + photo storage via /healthz?full=1 — plain /healthz is Railway's deploy check, Postgres only), is the app shell served, does the login wall hold?
# A failure opens one GitHub issue "🔴 Site down" (GitHub notifies the owner by e-mail/app); recovery comments and closes it.
# Needs the repo secret MB_URL (https://<domain>) — kept secret on purpose: the repo is public and the domain stays out of it.
# Nothing is added to the app itself (no third-party scripts, nothing sent anywhere but GitHub).
# Also opens "🟠 Deploy stuck" when main's mbs-vN is not live 45 min after it changed, and "🟡 … pause soon" after 45 days without a
# commit (GitHub pauses scheduled workflows in a public repo after 60) — re-enable it under Actions if that happens.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
          sparse-checkout: public/sw.js
      - name: Check the live site
        id: probe
        env:
          MB_URL: ${{ secrets.MB_URL }}
        run: |
          if [ -z "$MB_URL" ]; then echo "::notice::MB_URL is not set — uptime check skipped"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          B="${MB_URL%/}"; bad=""
          # 3 tries 40 s apart per check, so a Railway redeploy (about a minute) does not raise an alarm
          probe() { want=$1; url=$2; for n in 1 2 3; do code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true); [ "$code" = "$want" ] && break; [ $n -lt 3 ] && sleep 40; done; echo "${code:-000}"; }
          h=$(probe 200 "$B/healthz?full=1");               [ "$h" = 200 ] || bad="$bad health=$h"
          s=$(probe 200 "$B/sw.js");                 [ "$s" = 200 ] || bad="$bad app=$s"
          a=$(probe 401 "$B/api/b/state");           [ "$a" = 401 ] || bad="$bad login-wall=$a"
          echo "healthz=$h app=$s login-wall=$a"
          if [ -n "$bad" ]; then echo "down=1" >> "$GITHUB_OUTPUT"; echo "why=$bad" >> "$GITHUB_OUTPUT"; else echo "down=0" >> "$GITHUB_OUTPUT"; fi
          # deploy stuck: main ships a newer mbs-vN than the live site for more than 45 minutes (Railway build paused or failed)
          want=$(grep -o "mbs-v[0-9]*" public/sw.js | head -1); live=$(curl -s --max-time 20 "$B/sw.js" | grep -o "mbs-v[0-9]*" | head -1 || true)
          since=$(( $(date +%s) - $(git log -1 --format=%ct -- public/sw.js) ))
          echo "main=$want live=${live:-?} (sw.js changed ${since}s ago)"
          if [ -n "$live" ] && [ "$live" != "$want" ] && [ "$since" -gt 2700 ]; then echo "stuck=1" >> "$GITHUB_OUTPUT"; echo "stuckwhy=live $live, main $want" >> "$GITHUB_OUTPUT"; else echo "stuck=0" >> "$GITHUB_OUTPUT"; fi
          # GitHub pauses scheduled workflows in a public repo after 60 days without commits: warn from day 45
          echo "idle=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))" >> "$GITHUB_OUTPUT"

      - name: Open or close the alert issue
        if: steps.probe.outputs.skip != '1'
        uses: actions/github-script@v7
        env:
          DOWN: ${{ steps.probe.outputs.down }}
          WHY: ${{ steps.probe.outputs.why }}
          STUCK: ${{ steps.probe.outputs.stuck }}
          STUCKWHY: ${{ steps.probe.outputs.stuckwhy }}
          IDLE: ${{ steps.probe.outputs.idle }}
        with:
          script: |
            const title = '🔴 Site down — Memory Bookshelf';
            const issues = (await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'uptime', per_page: 10 })).data;
            const open = issues.find((i) => i.title === title);
            const when = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // one issue per kind, opened once and closed when it clears
            const flag = async (t, on, body, clear) => {
              const o = issues.find((i) => i.title === t);
              if (on && !o) await github.rest.issues.create({ ...context.repo, title: t, labels: ['uptime'], body });
              if (!on && o) { await github.rest.issues.createComment({ ...context.repo, issue_number: o.number, body: `${when}: ${clear}\n\n${run}` }); await github.rest.issues.update({ ...context.repo, issue_number: o.number, state: 'closed', state_reason: 'completed' }); }
            };
            await flag('🟠 Deploy stuck — the live site is behind main', process.env.STUCK === '1',
              `${when}: ${process.env.STUCKWHY} for more than 45 minutes.\n\nโค้ดที่ merge แล้วยังไม่ขึ้นเว็บจริง — ดู Railway → Deployments (build ค้าง/ล้ม หรือ Railway ล่ม: status.railway.app) แล้วกด Redeploy\n\n${run}`,
              'deployed ✅ — เว็บจริงตรงกับ main แล้ว');
            await flag('🟡 Uptime checks pause soon — no commit for 45+ days', +process.env.IDLE >= 45,
              `${when}: no commit for ${process.env.IDLE} days. GitHub pauses scheduled workflows (this uptime check and the weekly backup) after 60 days without a commit on a public repo.\n\nไม่มี commit มา ${process.env.IDLE} วัน — อีกไม่นาน GitHub จะหยุดการเช็กเว็บและ backup อัตโนมัติ ให้ commit อะไรก็ได้ (หรือเปิด Actions แล้ว enable workflow อีกครั้งถ้าถูกหยุดไปแล้ว)\n\n${run}`,
              'a new commit — the scheduled checks keep running ✅');
            if (process.env.DOWN === '1') {
              const body = `${when}: the check failed (${process.env.WHY.trim()}) after 3 tries.\n\nเว็บไม่ตอบหรือมีปัญหา — ดู Railway → Deployments / Logs\n\n${run}`;
              if (open) await github.rest.issues.createComment({ ...context.repo, issue_number: open.number, body });
              else await github.rest.issues.create({ ...context.repo, title, labels: ['uptime'], body });
              core.setFailed(`site down: ${process.env.WHY}`);
            } else if (open) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.number, body: `${when}: back up ✅ — เว็บกลับมาใช้ได้แล้ว\n\n${run}` });
              await github.rest.issues.update({ ...context.repo, issue_number: open.number, state: 'closed', state_reason: 'completed' });
            }
